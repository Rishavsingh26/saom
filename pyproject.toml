[project]
name = "saom"
version = "12.0.0"
description = "SAOM - Self-improving AI agent with memory, tools, and multi-provider LLM"
authors = [{ name = "Om" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
full = ["flask>=3.0", "sympy>=1.12"]

[project.scripts]
saom = "saom.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saom*"]
