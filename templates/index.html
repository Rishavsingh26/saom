<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SAOM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1a1a1a;--border:#222;--text:#e5e5e5;--text2:#888;--accent:#6366f1;--user:#6366f1;--bot:#1a1a1a;--green:#22c55e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;max-width:800px;margin:0 auto}

/* Header */
header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px}
.logo svg{width:24px;height:24px}
.logo span{font-weight:600;font-size:15px}
.status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.dot.loading{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.llm-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

/* Messages */
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;max-width:100%;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.avatar{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.avatar.user{background:var(--accent);color:#fff}
.avatar.bot{background:var(--surface2);color:var(--text2)}
.msg-content{flex:1;min-width:0}
.msg-name{font-size:11px;font-weight:600;margin-bottom:4px;color:var(--text2)}
.msg-text{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg-text code{background:var(--surface2);padding:1px 4px;border-radius:3px;font-size:13px;font-family:'SF Mono',Consolas,monospace}
.msg-text pre{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin:8px 0;overflow-x:auto}
.msg-text pre code{background:none;padding:0}
.msg-time{font-size:10px;color:var(--text2);margin-top:4px;opacity:.6}
.cursor{display:inline-block;width:2px;height:14px;background:var(--accent);margin-left:2px;animation:blink 1s infinite;vertical-align:text-bottom}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* Typing */
.typing{display:flex;gap:4px;padding:8px 0}
.typing span{width:5px;height:5px;background:var(--text2);border-radius:50%;animation:bounce 1.4s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}

/* Input */
#input-area{padding:12px 16px;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0}
#input-wrap{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;transition:border-color .2s}
#input-wrap:focus-within{border-color:var(--accent)}
#chat-input{flex:1;background:none;border:none;color:var(--text);font-size:14px;font-family:inherit;outline:none;resize:none;max-height:120px;line-height:1.5}
#chat-input::placeholder{color:var(--text2)}
#send-btn{width:32px;height:32px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s}
#send-btn:disabled{opacity:.3;cursor:not-allowed}
#send-btn svg{width:16px;height:16px}

/* Footer */
footer{padding:8px 16px;text-align:center;font-size:10px;color:var(--text2);border-top:1px solid var(--border);flex-shrink:0}

/* Mobile */
@media(max-width:640px){
  #app{max-width:100%}
  header{padding:10px 12px}
  #messages{padding:12px}
  #input-area{padding:8px 12px}
  .avatar{width:24px;height:24px;font-size:10px}
  .msg-text{font-size:13px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>
      <span>SAOM</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="llm-badge" id="llm">north-mini-code-free</span>
      <div class="status"><span class="dot" id="dot"></span><span id="status-text">Ready</span></div>
    </div>
  </header>
  <div id="messages">
    <div class="msg">
      <div class="avatar bot">O</div>
      <div class="msg-content">
        <div class="msg-name">SAOM</div>
        <div class="msg-text">Hey! I'm SAOM v12. Ask me anything.</div>
        <div class="msg-time" id="greeting-time"></div>
      </div>
    </div>
  </div>
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="chat-input" rows="1" placeholder="Message SAOM..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="send()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
  </div>
  <footer>SAOM v12 by Om</footer>
</div>
<script>
var SESSION='s'+Date.now(),WORKING=false;
document.getElementById('greeting-time').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function setStatus(s,t){document.getElementById('dot').className='dot'+(s==='working'?' loading':'');document.getElementById('status-text').textContent=t}
function scrollBottom(){var m=document.getElementById('messages');m.scrollTop=m.scrollHeight}
function addMsg(role,text,name){
  var d=document.createElement('div');d.className='msg';
  var av=role==='user'?'<div class="avatar user">Y</div>':'<div class="avatar bot">O</div>';
  var nm=name||(role==='user'?'You':'SAOM');
  d.innerHTML=av+'<div class="msg-content"><div class="msg-name">'+nm+'</div><div class="msg-text"></div><div class="msg-time">'+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div></div>';
  document.getElementById('messages').appendChild(d);
  scrollBottom();
  return d.querySelector('.msg-text');
}
function showTyping(){
  var d=document.createElement('div');d.className='msg';d.id='typing-msg';
  d.innerHTML='<div class="avatar bot">O</div><div class="msg-content"><div class="msg-name">SAOM</div><div class="typing"><span></span><span></span><span></span></div></div>';
  document.getElementById('messages').appendChild(d);scrollBottom();
}
function removeTyping(){var e=document.getElementById('typing-msg');if(e)e.remove()}

async async function send(){
  var input=document.getElementById('chat-input');
  var msg=input.value.trim();
  if(!msg||WORKING)return;
  input.value='';input.style.height='auto';
  addMsg('user',msg);
  WORKING=true;showTyping();setStatus('working','Thinking...');

  var el=null,body=null,started=false;
  try{
    var resp=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,session_id:SESSION})});
    var reader=resp.body.getReader(),dec=new TextDecoder(),buf='';
    while(true){
      var{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      var lines=buf.split('\n');buf=lines.pop();
      for(var line of lines){
        if(!line.startsWith('data:'))continue;
        try{
          var c=JSON.parse(line.slice(5));
          if(c.provider){document.getElementById('llm').textContent=c.provider;continue}
          if(!started){removeTyping();el=addMsg('assistant','');body=el;started=true;setStatus('working','Generating...')}
          if(c.chunk){body.textContent+=c.chunk;scrollBottom()}
          if(c.done&&c.full){body.textContent=c.full;scrollBottom()}
        }catch(e){}
      }
    }
    if(!started){removeTyping();addMsg('assistant','No response')}
    setStatus('ready','Ready');
  }catch(e){removeTyping();addMsg('assistant','Error: '+e.message);setStatus('ready','Ready')}
  WORKING=false;
}
</script>
</body>
</html>
