services:
  - type: web
    name: saom-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --no-sendfile --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SAOM_BASE_DIR
        value: /opt/render/project/src
    disk:
      name: saom-data
      mountPath: /var/data
      sizeGB: 1